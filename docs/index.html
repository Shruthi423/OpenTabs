<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenTabs</title>
  <meta name="description" content="OpenTabs — live design-job board: New, Previous, Just Raised.">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,400;0,500;1,400&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <!-- ── Permanent left rail: brand + settings, always on screen ───── -->
  <aside class="rail" id="rail" aria-label="Settings">

    <div class="rail-group" role="group" aria-label="Card size">
      <span class="rail-lbl">Size</span>
      <span class="rail-slider"><input id="size" type="range" min="14" max="44" value="24" title="Card size" aria-label="Card size"></span>
      <span class="rail-val" id="sizeVal">24</span>
    </div>

    <div class="rail-group swatches" id="swatches" role="group" aria-label="Theme">
      <span class="rail-lbl">Theme</span>
      <button class="sw" data-theme="dark"  style="--c:#0c0d0f" title="Dark"></button>
      <button class="sw" data-theme="paper" style="--c:#ffffff" title="Paper"></button>
      <button class="sw" data-theme="blush" style="--c:#f4dcda" title="Blush"></button>
      <button class="sw" data-theme="mint"  style="--c:#d9f0db" title="Mint"></button>
      <button class="sw" data-theme="cream" style="--c:#f1efbe" title="Cream"></button>
    </div>

    <a class="rail-brand" href="#top" title="OpenTabs" aria-label="OpenTabs">
      <span class="wordmark">OpenTabs</span>
      <svg viewBox="0 0 256 256" width="19" height="19" fill="currentColor" aria-hidden="true"><path d="M232,216H208V40a16,16,0,0,0-16-16H64A16,16,0,0,0,48,40V216H24a8,8,0,0,0,0,16H232a8,8,0,0,0,0-16Zm-64,0H64V40H168Zm-40-84a12,12,0,1,1,12,12A12,12,0,0,1,128,132Z"></path></svg>
    </a>
  </aside>

  <!-- ── One control row: search · filters · undo ─────────────────── -->
  <section class="controls" id="controls">
    <div class="row">
      <label class="field search">
        <input id="q" type="search" placeholder="Search title or company" autocomplete="off">
      </label>

      <!-- Filters only. Sorting lives in the settings drawer so that
           "Location" (filter) and "City" (sort) can never be confused. -->
      <div class="dd" data-dd="source" data-multi>
        <button class="dd-btn" type="button" aria-haspopup="true" aria-expanded="false">
          <span class="lbl">Source</span><span class="dd-sum">All</span>
          <svg class="dd-caret" viewBox="0 0 256 256" width="11" height="11" fill="currentColor" aria-hidden="true"><path d="M213.66,101.66l-80,80a8,8,0,0,1-11.32,0l-80-80A8,8,0,0,1,53.66,90.34L128,164.69l74.34-74.35a8,8,0,0,1,11.32,11.32Z"></path></svg>
        </button>
        <div class="dd-panel" role="listbox" aria-label="Source"></div>
      </div>
      <div class="dd" data-dd="loc" data-multi>
        <button class="dd-btn" type="button" aria-haspopup="true" aria-expanded="false">
          <span class="lbl">Location</span><span class="dd-sum">All</span>
          <svg class="dd-caret" viewBox="0 0 256 256" width="11" height="11" fill="currentColor" aria-hidden="true"><path d="M213.66,101.66l-80,80a8,8,0,0,1-11.32,0l-80-80A8,8,0,0,1,53.66,90.34L128,164.69l74.34-74.35a8,8,0,0,1,11.32,11.32Z"></path></svg>
        </button>
        <div class="dd-panel" role="listbox" aria-label="Location">
          <label class="dd-opt"><input type="checkbox" value="sfbay"><span>San Francisco &amp; Bay Area</span></label>
          <label class="dd-opt"><input type="checkbox" value="ny"><span>New York</span></label>
          <label class="dd-opt"><input type="checkbox" value="us"><span>Rest of USA</span></label>
          <label class="dd-opt"><input type="checkbox" value="remote"><span>Remote</span></label>
        </div>
      </div>
      <div class="dd" data-dd="date">
        <button class="dd-btn" type="button" aria-haspopup="true" aria-expanded="false">
          <span class="lbl">Posted</span><span class="dd-sum">Any time</span>
          <svg class="dd-caret" viewBox="0 0 256 256" width="11" height="11" fill="currentColor" aria-hidden="true"><path d="M213.66,101.66l-80,80a8,8,0,0,1-11.32,0l-80-80A8,8,0,0,1,53.66,90.34L128,164.69l74.34-74.35a8,8,0,0,1,11.32,11.32Z"></path></svg>
        </button>
        <div class="dd-panel" role="listbox" aria-label="Posted">
          <label class="dd-opt"><input type="radio" name="ddDate" value="" checked><span>Any time</span></label>
          <label class="dd-opt"><input type="radio" name="ddDate" value="3"><span>Last 3 hours</span></label>
          <label class="dd-opt"><input type="radio" name="ddDate" value="8"><span>Last 8 hours</span></label>
          <label class="dd-opt"><input type="radio" name="ddDate" value="16"><span>Last 16 hours</span></label>
          <label class="dd-opt"><input type="radio" name="ddDate" value="24"><span>Last 24 hours</span></label>
          <label class="dd-opt"><input type="radio" name="ddDate" value="72"><span>Last 3 days</span></label>
          <label class="dd-opt"><input type="radio" name="ddDate" value="168"><span>Last week</span></label>
          <label class="dd-opt"><input type="radio" name="ddDate" value="720"><span>Last 30 days</span></label>
        </div>
      </div>
      <div class="dd" data-dd="visa" data-multi>
        <button class="dd-btn" type="button" aria-haspopup="true" aria-expanded="false">
          <span class="lbl">Visa</span><span class="dd-sum">All</span>
          <svg class="dd-caret" viewBox="0 0 256 256" width="11" height="11" fill="currentColor" aria-hidden="true"><path d="M213.66,101.66l-80,80a8,8,0,0,1-11.32,0l-80-80A8,8,0,0,1,53.66,90.34L128,164.69l74.34-74.35a8,8,0,0,1,11.32,11.32Z"></path></svg>
        </button>
        <div class="dd-panel" role="listbox" aria-label="Visa">
          <label class="dd-opt"><input type="checkbox" value="yes"><span>Sponsors visa</span></label>
          <label class="dd-opt"><input type="checkbox" value="no"><span>No sponsorship</span></label>
          <label class="dd-opt"><input type="checkbox" value="unknown"><span>Unknown</span></label>
        </div>
      </div>

      <span class="seg seg-sort" role="group" aria-label="Sort by">
        <span class="lbl">Sort</span>
        <button class="sort" data-sort="new" title="Sort: Newest"><svg viewBox="0 0 256 256" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm56,112H128a8,8,0,0,1-8-8V72a8,8,0,0,1,16,0v48h48a8,8,0,0,1,0,16Z"></path></svg><span class="lbl">Newest</span></button>
        <button class="sort" data-sort="city" title="Sort: City"><svg viewBox="0 0 256 256" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M240,208H224V96a16,16,0,0,0-16-16H144V32a16,16,0,0,0-24.88-13.32L39.12,72A16,16,0,0,0,32,85.34V208H16a8,8,0,0,0,0,16H240a8,8,0,0,0,0-16ZM80,176a8,8,0,0,1-16,0V152a8,8,0,0,1,16,0Zm0-56a8,8,0,0,1-16,0V96a8,8,0,0,1,16,0Zm32,56a8,8,0,0,1-16,0V152a8,8,0,0,1,16,0Zm0-56a8,8,0,0,1-16,0V96a8,8,0,0,1,16,0Zm96,88H144V96h64Z"></path></svg><span class="lbl">City</span></button>
        <button class="sort" data-sort="pay" title="Sort: Pay (raise size on Just Raised)"><svg viewBox="0 0 256 256" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M240,64H16a8,8,0,0,0-8,8V184a8,8,0,0,0,8,8H240a8,8,0,0,0,8-8V72A8,8,0,0,0,240,64ZM32,176V152a24,24,0,0,1,24,24Zm0-72V80H56A24,24,0,0,1,32,104Zm96,48a24,24,0,1,1,24-24A24,24,0,0,1,128,152Zm96,24H200a24,24,0,0,1,24-24Zm0-72a24,24,0,0,1-24-24h24Z"></path></svg><span class="lbl">Pay</span></button>
      </span>

      <span class="status" id="status">Loading…</span>
      <button class="iconbtn undo-all" id="undoBtn" title="Undo last action" aria-label="Undo last action" disabled><svg viewBox="0 0 256 256" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M232,112a64.07,64.07,0,0,1-64,64H88v40a8,8,0,0,1-13.66,5.66l-48-48a8,8,0,0,1,0-11.32l48-48A8,8,0,0,1,88,120v40h80a48,48,0,0,0,0-96H80a8,8,0,0,1,0-16h88A64.07,64.07,0,0,1,232,112Z"></path></svg></button>
    </div>
  </section>

  <!-- ── Three columns: Today · Previous · Just Raised ─────────────── -->
  <main id="top" class="board">
    <section class="col" id="sec-today">
      <div class="col-head">
        <h2>Today</h2><em data-count="today">0</em><span class="hint">last 24h</span>
        <span class="showing" data-showing="today"></span>
        <button class="clear-all" data-clear="today">Clear all</button>
      </div>
      <div class="rows" id="rows-today"></div>
    </section>
    <section class="col" id="sec-prev">
      <div class="col-head">
        <h2>Previous</h2><em data-count="prev">0</em><span class="hint">older than 24h</span>
        <span class="showing" data-showing="prev"></span>
        <button class="clear-all" data-clear="prev">Clear all</button>
      </div>
      <div class="rows" id="rows-prev"></div>
    </section>
    <section class="col col-raised" id="sec-raised">
      <div class="col-head">
        <h2>Just Raised</h2>
        <em data-count="raised">0</em><span class="hint">SF / Bay Area</span>
        <span class="showing" data-showing="raised"></span>
        <button class="clear-all" data-clear="raised">Clear all</button>
      </div>
      <div class="rows" id="rows-raised"></div>
    </section>
  </main>

  <!-- ── Right panels: Applied · Trash (collapse and open) ──────────── -->
  <div class="drawer-tabs" id="drawerTabs">
    <button class="drawer-tab" id="tabApplied" aria-label="Open Applied"><span>Applied</span><em data-count="app">0</em></button>
    <button class="drawer-tab" id="tabTrash" aria-label="Open Trash"><span>Trash</span><em data-count="trash">0</em></button>
  </div>
  <div class="drawer-scrim" id="drawerScrim"></div>

  <aside class="drawer drawer-right" id="drawerApplied" aria-label="Applied jobs">
    <div class="drawer-head">
      <h2>Applied <em data-count="app">0</em></h2>
      <button class="clear-all" data-clear="app">Clear all</button>
      <button class="drawer-close" data-close aria-label="Close">✕</button>
    </div>
    <div class="rows" id="rows-app"></div>
  </aside>

  <aside class="drawer drawer-right" id="drawerTrash" aria-label="Deleted jobs">
    <div class="drawer-head">
      <h2>Trash <em data-count="trash">0</em></h2>
      <button class="clear-all neutral" data-clear="trash">Restore all</button>
      <button class="drawer-close" data-close aria-label="Close">✕</button>
    </div>
    <div class="rows" id="rows-trash"></div>
  </aside>

  <footer class="foot">
    <span class="foot-brand">
      <svg class="logo" viewBox="0 0 256 256" width="15" height="15" fill="currentColor" aria-hidden="true"><path d="M232,216H208V40a16,16,0,0,0-16-16H64A16,16,0,0,0,48,40V216H24a8,8,0,0,0,0,16H232a8,8,0,0,0,0-16Zm-64,0H64V40H168Zm-40-84a12,12,0,1,1,12-12A12,12,0,0,1,128,132Z"></path></svg>
      OpenTabs
    </span>
    <span class="stats"><b id="statOpen">0</b> tabs open · <b id="statDone">0</b> done · <b id="statRaises">0</b> raises</span>
    <span class="tagline">Close the tabs. Get the offer.</span>
  </footer>

  <!-- ── Confirm modal (Clear all) ─────────────────────────────────── -->
  <div class="modal-scrim" id="modalScrim" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalMsg">
      <p class="modal-msg" id="modalMsg"></p>
      <div class="modal-actions">
        <button class="modal-btn no" id="modalNo">No</button>
        <button class="modal-btn yes" id="modalYes">Yes</button>
      </div>
    </div>
  </div>

  <script src="./app.js" defer></script>
</body>
</html>
