<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenTabs</title>
  <meta name="description" content="OpenTabs — live design-job board: New, Previous, Just Raised.">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,400;0,500;1,400&family=Manrope:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <!-- ── Permanent left rail: brand + settings, always on screen ───── -->
  <aside class="rail" id="rail" aria-label="Settings">

    <div class="rail-group modes" id="modes" role="group" aria-label="Mode">
      <span class="rail-lbl">Mode</span>
      <button class="mode is-on" data-mode="board" type="button" aria-pressed="true"
              data-tip="Board — triage what's open">
        <svg viewBox="0 0 256 256" width="19" height="19" fill="currentColor" aria-hidden="true"><path d="M104,40H56A16,16,0,0,0,40,56v48a16,16,0,0,0,16,16h48a16,16,0,0,0,16-16V56A16,16,0,0,0,104,40Zm0,64H56V56h48v48Zm96-64H152a16,16,0,0,0-16,16v48a16,16,0,0,0,16,16h48a16,16,0,0,0,16-16V56A16,16,0,0,0,200,40Zm0,64H152V56h48v48Zm-96,32H56a16,16,0,0,0-16,16v48a16,16,0,0,0,16,16h48a16,16,0,0,0,16-16V152A16,16,0,0,0,104,136Zm0,64H56V152h48v48Zm96-64H152a16,16,0,0,0-16,16v48a16,16,0,0,0,16,16h48a16,16,0,0,0,16-16V152A16,16,0,0,0,200,136Zm0,64H152V152h48v48Z"></path></svg>
        <span class="sr">Board</span>
      </button>
      <button class="mode" data-mode="cognition" type="button" aria-pressed="false"
              aria-haspopup="true" data-tip="Brain — one thing at a time">
        <svg viewBox="0 0 256 256" width="19" height="19" fill="currentColor" aria-hidden="true"><path d="M248,124a56.11,56.11,0,0,0-32-50.61V72a48,48,0,0,0-88-26.49A48,48,0,0,0,40,72v1.39a56,56,0,0,0,0,101.2V176a48,48,0,0,0,88,26.49A48,48,0,0,0,216,176v-1.41A56.09,56.09,0,0,0,248,124ZM88,208a32,32,0,0,1-31.81-28.56A55.87,55.87,0,0,0,64,180h8a8,8,0,0,0,0-16H64A40,40,0,0,1,50.67,86.27,8,8,0,0,0,56,78.73V72a32,32,0,0,1,64,0v68.26A47.8,47.8,0,0,0,88,128a8,8,0,0,0,0,16,32,32,0,0,1,0,64Zm104-44h-8a8,8,0,0,0,0,16h8a55.87,55.87,0,0,0,7.81-.56A32,32,0,1,1,168,144a8,8,0,0,0,0-16,47.8,47.8,0,0,0-32,12.26V72a32,32,0,0,1,64,0v6.73a8,8,0,0,0,5.33,7.54A40,40,0,0,1,192,164Zm16-52a8,8,0,0,1-8,8h-4a36,36,0,0,1-36-36V80a8,8,0,0,1,16,0v4a20,20,0,0,0,20,20h4A8,8,0,0,1,208,112ZM60,120H56a8,8,0,0,1,0-16h4A20,20,0,0,0,80,84V80a8,8,0,0,1,16,0v4A36,36,0,0,1,60,120Z"></path></svg>
        <span class="sr">Brain — cognition mode</span>
      </button>
    </div>

    <div class="rail-group swatches" id="swatches" role="group" aria-label="Theme">
      <span class="rail-lbl">Theme</span>
      <button class="sw" data-theme="dark"  style="--c:#0c0d0f" title="Dark"></button>
      <button class="sw" data-theme="paper" style="--c:#ffffff" title="Paper"></button>
      <button class="sw" data-theme="blush" style="--c:#f4dcda" title="Blush"></button>
      <button class="sw" data-theme="mint"  style="--c:#d9f0db" title="Mint"></button>
      <button class="sw" data-theme="cream" style="--c:#f1efbe" title="Cream"></button>
    </div>

    <a class="rail-brand" href="#top" title="OpenTabs" aria-label="OpenTabs">
      <span class="wordmark">OpenTabs</span>
      <svg viewBox="0 0 256 256" width="19" height="19" fill="currentColor" aria-hidden="true"><path d="M232,216H208V40a16,16,0,0,0-16-16H64A16,16,0,0,0,48,40V216H24a8,8,0,0,0,0,16H232a8,8,0,0,0,0-16Zm-64,0H64V40H168Zm-40-84a12,12,0,1,1,12,12A12,12,0,0,1,128,132Z"></path></svg>
    </a>
  </aside>

  <!-- ── Which column do you want to work through? ─────────────────── -->
  <div class="cog-pick" id="cogPick" role="menu" aria-label="Focus a column" hidden>
    <span class="cog-pick-lbl">Work through</span>
    <button class="cog-pick-opt" data-col="today"  role="menuitem">Today<em data-count="today">0</em></button>
    <button class="cog-pick-opt" data-col="prev"   role="menuitem">Previous<em data-count="prev">0</em></button>
    <button class="cog-pick-opt" data-col="raised" role="menuitem">Just Raised<em data-count="raised">0</em></button>
  </div>

  <!-- ── One control row: search · filters · undo ─────────────────── -->
  <section class="controls" id="controls">
    <div class="row">
      <label class="field search">
        <span class="lbl">Search</span>
        <input id="q" type="search" placeholder="" autocomplete="off">
      </label>

      <!-- Filters and sort sit together, right-aligned; the search field
           keeps the left edge on its own. -->
      <div class="settings-group">
      <div class="dd" data-dd="source" data-multi>
        <button class="dd-btn" type="button" aria-haspopup="true" aria-expanded="false">
          <span class="lbl">Source</span><span class="dd-sum">All</span>
          <svg class="dd-caret" viewBox="0 0 256 256" width="11" height="11" fill="currentColor" aria-hidden="true"><path d="M213.66,101.66l-80,80a8,8,0,0,1-11.32,0l-80-80A8,8,0,0,1,53.66,90.34L128,164.69l74.34-74.35a8,8,0,0,1,11.32,11.32Z"></path></svg>
        </button>
        <div class="dd-panel" role="listbox" aria-label="Source"></div>
      </div>
      <div class="dd" data-dd="loc" data-multi>
        <button class="dd-btn" type="button" aria-haspopup="true" aria-expanded="false">
          <span class="lbl">Location</span><span class="dd-sum">All</span>
          <svg class="dd-caret" viewBox="0 0 256 256" width="11" height="11" fill="currentColor" aria-hidden="true"><path d="M213.66,101.66l-80,80a8,8,0,0,1-11.32,0l-80-80A8,8,0,0,1,53.66,90.34L128,164.69l74.34-74.35a8,8,0,0,1,11.32,11.32Z"></path></svg>
        </button>
        <div class="dd-panel" role="listbox" aria-label="Location">
          <label class="dd-opt"><input type="checkbox" value="sfbay"><span>San Francisco &amp; Bay Area</span></label>
          <label class="dd-opt"><input type="checkbox" value="ny"><span>New York</span></label>
          <label class="dd-opt"><input type="checkbox" value="us"><span>Rest of USA</span></label>
          <label class="dd-opt"><input type="checkbox" value="remote"><span>Remote</span></label>
        </div>
      </div>
      <div class="dd" data-dd="date">
        <button class="dd-btn" type="button" aria-haspopup="true" aria-expanded="false">
          <span class="lbl">Posted</span><span class="dd-sum">Any time</span>
          <svg class="dd-caret" viewBox="0 0 256 256" width="11" height="11" fill="currentColor" aria-hidden="true"><path d="M213.66,101.66l-80,80a8,8,0,0,1-11.32,0l-80-80A8,8,0,0,1,53.66,90.34L128,164.69l74.34-74.35a8,8,0,0,1,11.32,11.32Z"></path></svg>
        </button>
        <div class="dd-panel" role="listbox" aria-label="Posted">
          <label class="dd-opt"><input type="radio" name="ddDate" value="" checked><span>Any time</span></label>
          <label class="dd-opt"><input type="radio" name="ddDate" value="3"><span>Last 3 hours</span></label>
          <label class="dd-opt"><input type="radio" name="ddDate" value="8"><span>Last 8 hours</span></label>
          <label class="dd-opt"><input type="radio" name="ddDate" value="16"><span>Last 16 hours</span></label>
          <label class="dd-opt"><input type="radio" name="ddDate" value="24"><span>Last 24 hours</span></label>
          <label class="dd-opt"><input type="radio" name="ddDate" value="72"><span>Last 3 days</span></label>
          <label class="dd-opt"><input type="radio" name="ddDate" value="168"><span>Last week</span></label>
          <label class="dd-opt"><input type="radio" name="ddDate" value="720"><span>Last 30 days</span></label>
        </div>
      </div>
      <div class="dd" data-dd="visa" data-multi>
        <button class="dd-btn" type="button" aria-haspopup="true" aria-expanded="false">
          <span class="lbl">Visa</span><span class="dd-sum">All</span>
          <svg class="dd-caret" viewBox="0 0 256 256" width="11" height="11" fill="currentColor" aria-hidden="true"><path d="M213.66,101.66l-80,80a8,8,0,0,1-11.32,0l-80-80A8,8,0,0,1,53.66,90.34L128,164.69l74.34-74.35a8,8,0,0,1,11.32,11.32Z"></path></svg>
        </button>
        <div class="dd-panel" role="listbox" aria-label="Visa">
          <label class="dd-opt"><input type="checkbox" value="yes"><span>Sponsors visa</span></label>
          <label class="dd-opt"><input type="checkbox" value="no"><span>No sponsorship</span></label>
          <label class="dd-opt"><input type="checkbox" value="unknown"><span>Unknown</span></label>
        </div>
      </div>

      <span class="seg seg-sort" role="group" aria-label="Sort by">
        <span class="lbl">Sort</span>
        <button class="sort" data-sort="new" title="Sort: Newest"><svg viewBox="0 0 256 256" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm56,112H128a8,8,0,0,1-8-8V72a8,8,0,0,1,16,0v48h48a8,8,0,0,1,0,16Z"></path></svg><span class="lbl">Newest</span></button>
        <button class="sort" data-sort="city" title="Sort: City"><svg viewBox="0 0 256 256" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M240,208H224V96a16,16,0,0,0-16-16H144V32a16,16,0,0,0-24.88-13.32L39.12,72A16,16,0,0,0,32,85.34V208H16a8,8,0,0,0,0,16H240a8,8,0,0,0,0-16ZM80,176a8,8,0,0,1-16,0V152a8,8,0,0,1,16,0Zm0-56a8,8,0,0,1-16,0V96a8,8,0,0,1,16,0Zm32,56a8,8,0,0,1-16,0V152a8,8,0,0,1,16,0Zm0-56a8,8,0,0,1-16,0V96a8,8,0,0,1,16,0Zm96,88H144V96h64Z"></path></svg><span class="lbl">City</span></button>
        <button class="sort" data-sort="pay" title="Sort: Pay (raise size on Just Raised)"><svg viewBox="0 0 256 256" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M240,64H16a8,8,0,0,0-8,8V184a8,8,0,0,0,8,8H240a8,8,0,0,0,8-8V72A8,8,0,0,0,240,64ZM32,176V152a24,24,0,0,1,24,24Zm0-72V80H56A24,24,0,0,1,32,104Zm96,48a24,24,0,1,1,24-24A24,24,0,0,1,128,152Zm96,24H200a24,24,0,0,1,24-24Zm0-72a24,24,0,0,1-24-24h24Z"></path></svg><span class="lbl">Pay</span></button>
      </span>

      </div>

      <span class="status" id="status">Loading…</span>
      <button class="iconbtn undo-all" id="undoBtn" title="Undo last action" aria-label="Undo last action" disabled><svg viewBox="0 0 256 256" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M232,112a64.07,64.07,0,0,1-64,64H88v40a8,8,0,0,1-13.66,5.66l-48-48a8,8,0,0,1,0-11.32l48-48A8,8,0,0,1,88,120v40h80a48,48,0,0,0,0-96H80a8,8,0,0,1,0-16h88A64.07,64.07,0,0,1,232,112Z"></path></svg></button>
    </div>
  </section>

  <!-- ── Three columns: Today · Previous · Just Raised ─────────────── -->
  <main id="top" class="board">
    <section class="col" id="sec-today">
      <div class="col-head">
        <h2><svg class="col-ico" viewBox="0 0 256 256" width="14" height="14" fill="currentColor" aria-hidden="true"><path d="M215.79,118.17a8,8,0,0,0-5-5.66L153.18,90.9l14.66-73.33a8,8,0,0,0-13.69-7l-112,120a8,8,0,0,0,3,13l57.63,21.61L88.16,238.43a8,8,0,0,0,13.69,7l112-120A8,8,0,0,0,215.79,118.17ZM109.37,214l10.47-52.38a8,8,0,0,0-5-9.06L62,132.71l84.62-90.66L136.16,94.43a8,8,0,0,0,5,9.06l52.8,19.8Z"></path></svg>Today</h2><em data-count="today">0</em><span class="hint">last 24h</span>
        <span class="showing" data-showing="today"></span>
        <button class="col-focus" data-focus="today" title="Work through Today one at a time" aria-label="Work through Today one at a time"><svg viewBox="0 0 256 256" width="14" height="14" fill="currentColor" aria-hidden="true"><path d="M248,124a56.11,56.11,0,0,0-32-50.61V72a48,48,0,0,0-88-26.49A48,48,0,0,0,40,72v1.39a56,56,0,0,0,0,101.2V176a48,48,0,0,0,88,26.49A48,48,0,0,0,216,176v-1.41A56.09,56.09,0,0,0,248,124ZM88,208a32,32,0,0,1-31.81-28.56A55.87,55.87,0,0,0,64,180h8a8,8,0,0,0,0-16H64A40,40,0,0,1,50.67,86.27,8,8,0,0,0,56,78.73V72a32,32,0,0,1,64,0v68.26A47.8,47.8,0,0,0,88,128a8,8,0,0,0,0,16,32,32,0,0,1,0,64Zm104-44h-8a8,8,0,0,0,0,16h8a55.87,55.87,0,0,0,7.81-.56A32,32,0,1,1,168,144a8,8,0,0,0,0-16,47.8,47.8,0,0,0-32,12.26V72a32,32,0,0,1,64,0v6.73a8,8,0,0,0,5.33,7.54A40,40,0,0,1,192,164Zm16-52a8,8,0,0,1-8,8h-4a36,36,0,0,1-36-36V80a8,8,0,0,1,16,0v4a20,20,0,0,0,20,20h4A8,8,0,0,1,208,112ZM60,120H56a8,8,0,0,1,0-16h4A20,20,0,0,0,80,84V80a8,8,0,0,1,16,0v4A36,36,0,0,1,60,120Z"></path></svg></button>
        <button class="clear-all" data-clear="today">Clear all</button>
      </div>
      <div class="rows" id="rows-today"></div>
    </section>
    <section class="col" id="sec-prev">
      <div class="col-head">
        <h2><svg class="col-ico" viewBox="0 0 256 256" width="14" height="14" fill="currentColor" aria-hidden="true"><path d="M216,208H168V184h4a68.07,68.07,0,0,0,68-68,28,28,0,0,0-56,0,12,12,0,0,1-12,12h-4V56a40,40,0,0,0-80,0V88H84A12,12,0,0,1,72,76a28,28,0,0,0-56,0,68.07,68.07,0,0,0,68,68h4v64H40a8,8,0,0,0,0,16H216a8,8,0,0,0,0-16ZM96,128H84A52.06,52.06,0,0,1,32,76a12,12,0,0,1,24,0,28,28,0,0,0,28,28H96a8,8,0,0,0,8-8V56a24,24,0,0,1,48,0v80a8,8,0,0,0,8,8h12a28,28,0,0,0,28-28,12,12,0,0,1,24,0,52.06,52.06,0,0,1-52,52H160a8,8,0,0,0-8,8v32H104V136A8,8,0,0,0,96,128Z"></path></svg>Previous</h2><em data-count="prev">0</em><span class="hint">older than 24h</span>
        <span class="showing" data-showing="prev"></span>
        <button class="col-focus" data-focus="prev" title="Work through Previous one at a time" aria-label="Work through Previous one at a time"><svg viewBox="0 0 256 256" width="14" height="14" fill="currentColor" aria-hidden="true"><path d="M248,124a56.11,56.11,0,0,0-32-50.61V72a48,48,0,0,0-88-26.49A48,48,0,0,0,40,72v1.39a56,56,0,0,0,0,101.2V176a48,48,0,0,0,88,26.49A48,48,0,0,0,216,176v-1.41A56.09,56.09,0,0,0,248,124ZM88,208a32,32,0,0,1-31.81-28.56A55.87,55.87,0,0,0,64,180h8a8,8,0,0,0,0-16H64A40,40,0,0,1,50.67,86.27,8,8,0,0,0,56,78.73V72a32,32,0,0,1,64,0v68.26A47.8,47.8,0,0,0,88,128a8,8,0,0,0,0,16,32,32,0,0,1,0,64Zm104-44h-8a8,8,0,0,0,0,16h8a55.87,55.87,0,0,0,7.81-.56A32,32,0,1,1,168,144a8,8,0,0,0,0-16,47.8,47.8,0,0,0-32,12.26V72a32,32,0,0,1,64,0v6.73a8,8,0,0,0,5.33,7.54A40,40,0,0,1,192,164Zm16-52a8,8,0,0,1-8,8h-4a36,36,0,0,1-36-36V80a8,8,0,0,1,16,0v4a20,20,0,0,0,20,20h4A8,8,0,0,1,208,112ZM60,120H56a8,8,0,0,1,0-16h4A20,20,0,0,0,80,84V80a8,8,0,0,1,16,0v4A36,36,0,0,1,60,120Z"></path></svg></button>
        <button class="clear-all" data-clear="prev">Clear all</button>
      </div>
      <div class="rows" id="rows-prev"></div>
    </section>
    <section class="col col-raised" id="sec-raised">
      <div class="col-head">
        <h2>Just Raised</h2>
        <em data-count="raised">0</em><span class="hint">SF / Bay Area</span>
        <span class="showing" data-showing="raised"></span>
        <button class="col-focus" data-focus="raised" title="Work through Just Raised one at a time" aria-label="Work through Just Raised one at a time"><svg viewBox="0 0 256 256" width="14" height="14" fill="currentColor" aria-hidden="true"><path d="M248,124a56.11,56.11,0,0,0-32-50.61V72a48,48,0,0,0-88-26.49A48,48,0,0,0,40,72v1.39a56,56,0,0,0,0,101.2V176a48,48,0,0,0,88,26.49A48,48,0,0,0,216,176v-1.41A56.09,56.09,0,0,0,248,124ZM88,208a32,32,0,0,1-31.81-28.56A55.87,55.87,0,0,0,64,180h8a8,8,0,0,0,0-16H64A40,40,0,0,1,50.67,86.27,8,8,0,0,0,56,78.73V72a32,32,0,0,1,64,0v68.26A47.8,47.8,0,0,0,88,128a8,8,0,0,0,0,16,32,32,0,0,1,0,64Zm104-44h-8a8,8,0,0,0,0,16h8a55.87,55.87,0,0,0,7.81-.56A32,32,0,1,1,168,144a8,8,0,0,0,0-16,47.8,47.8,0,0,0-32,12.26V72a32,32,0,0,1,64,0v6.73a8,8,0,0,0,5.33,7.54A40,40,0,0,1,192,164Zm16-52a8,8,0,0,1-8,8h-4a36,36,0,0,1-36-36V80a8,8,0,0,1,16,0v4a20,20,0,0,0,20,20h4A8,8,0,0,1,208,112ZM60,120H56a8,8,0,0,1,0-16h4A20,20,0,0,0,80,84V80a8,8,0,0,1,16,0v4A36,36,0,0,1,60,120Z"></path></svg></button>
        <button class="clear-all" data-clear="raised">Clear all</button>
      </div>
      <div class="rows" id="rows-raised"></div>
    </section>
  </main>

  <!-- ── Cognition mode: one card, one decision, nothing else ────────
       A cursor over the chosen column. The deck shrinks as you decide, so
       progress counts down and every action carries its own Undo — going
       back cannot show you a card you already filed. ─────────────────── -->
  <section class="cog" id="cog" aria-label="Cognition mode">
    <header class="cog-head">
      <h2 class="cog-col" id="cogCol">Today</h2>
      <span class="cog-left" id="cogLeft"></span>
      <button class="cog-exit" id="cogExit" type="button">Back to board <kbd>Esc</kbd></button>
    </header>

    <button class="cog-arrow prev" id="cogPrev" type="button" aria-label="Previous listing">
      <svg viewBox="0 0 256 256" width="26" height="26" fill="currentColor" aria-hidden="true"><path d="M165.66,202.34a8,8,0,0,1-11.32,11.32l-80-80a8,8,0,0,1,0-11.32l80-80a8,8,0,0,1,11.32,11.32L91.31,128Z"></path></svg>
    </button>

    <div class="cog-stage" id="cogStage" aria-live="polite"></div>

    <button class="cog-arrow next" id="cogNext" type="button" aria-label="Next listing">
      <svg viewBox="0 0 256 256" width="26" height="26" fill="currentColor" aria-hidden="true"><path d="M181.66,133.66l-80,80a8,8,0,0,1-11.32-11.32L164.69,128,90.34,53.66a8,8,0,0,1,11.32-11.32l80,80A8,8,0,0,1,181.66,133.66Z"></path></svg>
    </button>

    <div class="cog-toast" id="cogToast" role="status"></div>

    <!-- hints are rewritten per column: Just Raised has no "Applied" -->
    <footer class="cog-keys" id="cogKeys"></footer>
  </section>

  <!-- ── Right panels: Applied · Trash (collapse and open) ──────────── -->
  <div class="drawer-tabs" id="drawerTabs">
    <button class="drawer-tab" id="tabApplied" aria-label="Open Applied"><span>Applied</span><em data-count="app">0</em></button>
    <button class="drawer-tab" id="tabTrash" aria-label="Open Trash"><span>Trash</span><em data-count="trash">0</em></button>
  </div>
  <div class="drawer-scrim" id="drawerScrim"></div>

  <aside class="drawer drawer-right" id="drawerApplied" aria-label="Applied jobs">
    <div class="drawer-head">
      <h2>Applied <em data-count="app">0</em></h2>
      <button class="clear-all" data-clear="app">Clear all</button>
      <button class="drawer-close" data-close aria-label="Close">✕</button>
    </div>
    <div class="rows" id="rows-app"></div>
  </aside>

  <aside class="drawer drawer-right" id="drawerTrash" aria-label="Deleted jobs">
    <div class="drawer-head">
      <h2>Trash <em data-count="trash">0</em></h2>
      <button class="clear-all neutral" data-clear="trash">Restore all</button>
      <button class="drawer-close" data-close aria-label="Close">✕</button>
    </div>
    <div class="rows" id="rows-trash"></div>
  </aside>

  <footer class="foot">
    <span class="foot-brand">
      <svg class="logo" viewBox="0 0 256 256" width="15" height="15" fill="currentColor" aria-hidden="true"><path d="M232,216H208V40a16,16,0,0,0-16-16H64A16,16,0,0,0,48,40V216H24a8,8,0,0,0,0,16H232a8,8,0,0,0,0-16Zm-64,0H64V40H168Zm-40-84a12,12,0,1,1,12-12A12,12,0,0,1,128,132Z"></path></svg>
      OpenTabs
    </span>
    <span class="stats"><b id="statOpen">0</b> tabs open · <b id="statDone">0</b> done · <b id="statRaises">0</b> raises</span>
    <span class="tagline">Close the tabs. Get the offer.</span>
  </footer>

  <!-- ── Confirm modal (Clear all) ─────────────────────────────────── -->
  <div class="modal-scrim" id="modalScrim" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalMsg">
      <p class="modal-msg" id="modalMsg"></p>
      <div class="modal-actions">
        <button class="modal-btn no" id="modalNo">No</button>
        <button class="modal-btn yes" id="modalYes">Yes</button>
      </div>
    </div>
  </div>

  <script src="./app.js" defer></script>
</body>
</html>
